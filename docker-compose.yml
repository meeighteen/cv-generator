services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_cv_app
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Lima
      - TZ=America/Lima
      # Permite a n8n leer y escribir archivos del sistema montado
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./templates:/data/templates:ro
      - ./output:/data/output:rw
    depends_on:
      - gotenberg

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg_engine
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  n8n_data:
    driver: local
